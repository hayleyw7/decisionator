<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Decisionator</title>
  <desc id="desc">Add your options. We will pick one.</desc>

  <image href="og-image-bg.png" xlink:href="og-image-bg.png" width="1200" height="630" preserveAspectRatio="none"/>
  <image href="og-image-art.png" xlink:href="og-image-art.png" x="430" y="70" width="740" height="388" preserveAspectRatio="xMidYMid slice"/>

  <g font-family="Courier">
    <text x="72" y="122" fill="#9baa91" font-size="20" font-weight="700" letter-spacing="4">WHEN YOU JUST CAN'T PICK</text>

    <text x="68" y="250" fill="#f5f0e8" font-size="78" font-weight="700" letter-spacing="-3">Decisionator</text>

    <text x="72" y="328" fill="#d8d0c5" font-size="30">
